options:
  logging: CLOUD_LOGGING_ONLY
  
substitutions:
  _REGION: us-central1
  
steps:
  # Step 1: Delete Cloud Run service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Delete Cloud Run service'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deleting Cloud Run service: patient-handoff"
        gcloud run services delete patient-handoff \
          --region=$_REGION \
          --platform=managed \
          --quiet || echo "Service may not exist or already deleted"
    
  # Step 2: Delete images from Artifact Registry
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Delete Artifact Registry images'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deleting images from Artifact Registry"
        gcloud artifacts docker images delete \
          $_REGION-docker.pkg.dev/$PROJECT_ID/patient-handoff/patient-handoff:latest \
          --quiet || echo "Images may not exist or already deleted"
        
        # Delete all versions
        gcloud artifacts docker images list \
          $_REGION-docker.pkg.dev/$PROJECT_ID/patient-handoff/patient-handoff \
          --format="value(version)" | while read version; do
          gcloud artifacts docker images delete \
            $_REGION-docker.pkg.dev/$PROJECT_ID/patient-handoff/patient-handoff@$version \
            --quiet || true
        done
    
  # Step 3: Clean up any remaining resources
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: 'Cleanup'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Cleanup completed"
        echo "Note: Artifact Registry repository and state bucket are preserved"
        echo "To fully clean up, run: terraform destroy"
